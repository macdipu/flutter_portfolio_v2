name: Deploy Flutter Developer Portfolio V2 to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - "lib/**"
      - "web/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/deploy.yml"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache Flutter & Pub
        uses: actions/cache@v3
        with:
          path: |
            ~/.pub-cache
            ${{ runner.tool_cache }}/flutter
          key: ${{ runner.os }}-flutter-${{ hashFiles('pubspec.lock') }}
          restore-keys: ${{ runner.os }}-flutter-

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable web
        run: flutter config --enable-web

      - name: Install dependencies
        run: flutter pub get

      - name: Build for custom domain + redirect
        run: flutter build web --release --base-href /

      - name: Cache-bust entrypoints (GitHub Pages/Cloudflare cache 4h)
        run: |
          V=${GITHUB_SHA::8}
          sed -i "s|flutter_bootstrap.js\"|flutter_bootstrap.js?v=$V\"|" build/web/index.html
          sed -i "s|\"mainJsPath\":\"main.dart.js\"|\"mainJsPath\":\"main.dart.js?v=$V\"|" build/web/flutter_bootstrap.js
          grep -o 'flutter_bootstrap.js?v=[a-z0-9]*' build/web/index.html
          grep -o 'main.dart.js?v=[a-z0-9]*' build/web/flutter_bootstrap.js

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
          cname: masadcd.online
