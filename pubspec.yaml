name: flutter_portfolio
description: A Flutter Developer Portfolio Landing Page
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  url_launcher: ^6.3.2
  web: ^1.1.0
  http: ^1.6.0
  shared_preferences: ^2.5.4



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/projects/
  fonts:
    - family: Bricolage
      fonts:
        - asset: assets/fonts/Bricolage.ttf
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader.ttf
        - asset: assets/fonts/Newsreader-Italic.ttf
          style: italic
