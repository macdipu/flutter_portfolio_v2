name: flutter_portfolio
description: A Flutter Developer Portfolio Landing Page
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  url_launcher: ^6.3.2
  web: ^1.1.0
  http: ^1.6.0
  shared_preferences: ^2.5.4



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/projects/
    # Reading face: loaded after the first frame (lib/core/design/deferred_fonts.dart)
    # so it is not on the critical path of the intro.
    - assets/fonts/Newsreader.ttf
    - assets/fonts/Newsreader-Italic.ttf
  fonts:
    - family: Bricolage
      fonts:
        - asset: assets/fonts/Bricolage.ttf
