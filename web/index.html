      var LINES = ['MD. ASAD', 'CHOWDHURY DIPU'];

      var t0 = performance.now();

      function skip() { offset = Math.max(offset, T.settleA - 0.1 - (performance.now() - t0) / 1000); }
      skipBtn.addEventListener('click', skip);
      window.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !finished) skip(); });
      setTimeout(function () { if (!reduced && !seen) skipBtn.classList.add('show'); }, 1000);
      if (reduced || seen) skipBtn.style.display = 'none';

      function frame() {
        if (finished) return;
        var t = now();
        if (t >= T.end) { played = true; finish(); }
        if (reduced) drawStatic(); else draw(Math.min(t, T.end));
        requestAnimationFrame(frame);
      }

      var resizeTimer;
      window.addEventListener('resize', function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function () { if (!finished) build(); }, 150);
      });

      function start() {
        build();
        t0 = performance.now();
        requestAnimationFrame(frame);
      }
      // Wait (briefly) for the face so the words are measured and drawn in it.
      var started = false;
      function go() { if (!started) { started = true; start(); } }
      if (document.fonts && document.fonts.load) {
        document.fonts.load('800 100px Bricolage').then(go, go);
        setTimeout(go, 1200);
      } else { go(); }
    })();
  </script>
