  <script>
    (function () {

      var seen = false;

      var ROLE = 'Forward Deployed Engineer';
      var ready = false, played = false, finished = false;

      // ---- Timeline, in seconds. Every position below is a pure function of
      // time, so skipping, resizing and seeking all stay consistent. ----
      var T = {
        convStart: 1.0, convDur: 1.7, convStagger: 0.4,   // letters swirl into MACDIPU
        formA: 2.6, formB: 3.3,                            // the word sharpens, glow builds
        dissA: 3.9, dissB: 4.4,                            // letters break into fine particles
        scatA: 3.95, scatB: 4.65,                          // a short, tight burst
        reconA: 4.65, reconDur: 0.9, reconStagger: 0.35,   // particles flow into the name
        nameA: 5.55, nameB: 6.15,                          // the name resolves
        subA: 6.0, subB: 6.5,                              // the role fades in
        end: 6.8
      };

      var rs = getComputedStyle(document.documentElement);
      function css(n) { return rs.getPropertyValue(n).trim(); }
      function rgb(hex) {
        hex = hex.replace('#', '');

      var BG = rgb(css('--bg')), FG = css('--fg'), SIG = css('--sig');
      // Additive glow only works on dark; on light, particles are drawn solid.
      var LIGHT = (BG[0] * 299 + BG[1] * 587 + BG[2] * 114) / 1000 > 140;
      var GLOW_BLEND = LIGHT ? 'source-over' : 'lighter';

      function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
      function sm(t, a, b) { var x = clamp((t - a) / (b - a), 0, 1); return x * x * (3 - 2 * x); }

      var W = 0, H = 0, dpr = 1, N = 1000;
      var sprites = [], dust = [];
      var layout1, layout2, subY = 0, subSize = 14;
      var atlasFg = [], atlasSig = [], glow;

      function makeAtlas(color) {
        var out = [];
        for (var i = 0; i < 26; i++) {
          var c = document.createElement('canvas'); c.width = c.height = 64;
          var g = c.getContext('2d');
          g.font = '700 46px Bricolage, system-ui, sans-serif';
          g.textAlign = 'center'; g.textBaseline = 'middle';
          g.fillStyle = color;
          g.fillText(String.fromCharCode(65 + i), 32, 35);
          out.push(c);
        }
        return out;
      }
      function makeGlow() {
        var c = document.createElement('canvas'); c.width = c.height = 64;
        var g = c.getContext('2d');
        var grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
        if (LIGHT) {
          grad.addColorStop(0, SIG);
          grad.addColorStop(.55, SIG);
          grad.addColorStop(.8, SIG.length === 7 ? SIG + '55' : SIG);
          grad.addColorStop(1, 'rgba(0,0,0,0)');
        } else {
          grad.addColorStop(0, 'rgba(255,255,255,1)');
          grad.addColorStop(.2, SIG);
          grad.addColorStop(.55, SIG.length === 7 ? SIG + '44' : SIG);
          grad.addColorStop(1, 'rgba(0,0,0,0)');
        }
        g.fillStyle = grad; g.fillRect(0, 0, 64, 64);
        return c;
      }

      function fit(lines, maxFs, frac) {
        var m = document.createElement('canvas').getContext('2d');
        m.font = '800 100px Bricolage, system-ui, sans-serif';
        var widest = 0;
        lines.forEach(function (l) { widest = Math.max(widest, m.measureText(l).width); });
        return Math.min(maxFs, (W * frac) / (widest / 100));
      }
      function makeLayout(lines, maxFs, dy) {
        var fs = fit(lines, maxFs, 0.84);
        return { lines: lines, fs: fs, lh: fs * 1.08, dy: dy ? dy(fs) : 0 };
      }
      function drawLines(g, lay, color) {
        g.font = '800 ' + lay.fs + 'px Bricolage, system-ui, sans-serif';
        g.textAlign = 'center'; g.textBaseline = 'middle';
        if ('letterSpacing' in g) g.letterSpacing = (-lay.fs * 0.012) + 'px';
        g.fillStyle = color;
        var top = H / 2 + lay.dy - (lay.lines.length - 1) * lay.lh / 2;
        lay.lines.forEach(function (l, i) { g.fillText(l, W / 2, top + i * lay.lh); });
      }
      function samplePoints(lay) {
        var c = document.createElement('canvas'); c.width = W; c.height = H;
        var g = c.getContext('2d', { willReadFrequently: true });
        drawLines(g, lay, '#fff');
        var data = g.getImageData(0, 0, W, H).data;
        var pts = [];
        for (var y = 0; y < H; y += 2) {
          for (var x = 0; x < W; x += 2) {
            if (data[(y * W + x) * 4 + 3] > 128) pts.push([x, y]);
          }
        }
        for (var i = pts.length - 1; i > 0; i--) {
          var j = (Math.random() * (i + 1)) | 0, t = pts[i]; pts[i] = pts[j]; pts[j] = t;
        }
        var out = [];
        for (var k = 0; k < N; k++) {
          var p = pts[k % Math.max(pts.length, 1)] || [W / 2, H / 2];
          var extra = k >= pts.length ? 2 : 0;
          out.push([p[0] + rnd(-extra, extra), p[1] + rnd(-extra, extra)]);
        }
        return out;
      }

      function build() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth; H = window.innerHeight;
        canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
        N = W < 600 ? 700 : 1100;

        layout1 = makeLayout(['MACDIPU'], Math.min(W * 0.17, 190));
        // The name is always two lines: bigger, and balanced on every screen.
        layout2 = makeLayout(['MD. ASAD', 'CHOWDHURY DIPU'], Math.min(W * 0.115, 124),
          function (fs) { return -fs * 0.22; });
        var blockBottom = H / 2 + layout2.dy + layout2.lh * 0.5 + layout2.lh * 0.5;
        subSize = clamp(layout2.fs * 0.19, 14, 24);
        subY = blockBottom + layout2.fs * 0.42;

        var p1 = samplePoints(layout1), p2 = samplePoints(layout2);
        var cx = W / 2, cy = H / 2;
        // Big enough that the word reads as a mosaic of letters while it holds.
        var tsz1 = clamp(layout1.fs * 0.1, 8, 19);
        var tsz2 = clamp(layout2.fs * 0.075, 4, 9);

        if (sprites.length !== N) {
          sprites = [];
          for (var i = 0; i < N; i++) {
            var z = rnd(.45, 1);   // depth: far letters are smaller, dimmer, slower
            sprites.push({
              nx: Math.random(), ny: Math.random(), z: z,
              fx: rnd(.35, .9) * z, fy: rnd(.35, .9) * z, ph: rnd(0, 6.28),
              ax: rnd(20, 80) * z, ay: rnd(20, 80) * z, vx: rnd(-12, 12) * z, vy: rnd(-10, 10) * z,
              r0: rnd(0, 6.28), vr: rnd(-1, 1) * z,
              s0: rnd(14, 42) * z, a0: rnd(.4, 1) * z,
              ch: (Math.random() * 26) | 0, sig: Math.random() < .12,
              d1: Math.random() * T.convStagger, d2: Math.random() * T.reconStagger,
              k1: rnd(.28, .5), k2: rnd(.2, .4),   // one rotational sense: a vortex, not a blast
              R: rnd(30, 120)
            });
          }
        }
        for (var k = 0; k < N; k++) {
          var s = sprites[k];
          s.t1x = p1[k][0]; s.t1y = p1[k][1]; s.t2x = p2[k][0]; s.t2y = p2[k][1];
          s.ts1 = tsz1 * rnd(.9, 1.15); s.ts2 = tsz2 * rnd(.9, 1.15);
          s.bx = s.nx * W; s.by = s.ny * H;
          var ang = Math.atan2(s.t1y - cy, s.t1x - cx) + rnd(-.8, .8);
          s.sx = s.t1x + Math.cos(ang) * s.R; s.sy = s.t1y + Math.sin(ang) * s.R * 0.8;
        }
        if (dust.length === 0) {
          for (var d = 0; d < 70; d++) {
            dust.push({ nx: Math.random(), ny: Math.random(), z: rnd(.3, 1), ph: rnd(0, 6.28) });
          }
        }
      }

      function floatPos(s, t) {
        return [s.bx + Math.sin(t * s.fx + s.ph) * s.ax + s.vx * t,
                s.by + Math.cos(t * s.fy + s.ph * 1.3) * s.ay + s.vy * t];
      }
      function bez(ax, ay, cx, cy, bx, by, u) {
        var m = 1 - u;
        return [m * m * ax + 2 * m * u * cx + u * u * bx, m * m * ay + 2 * m * u * cy + u * u * by];
      }
      // Control point offset sideways by a fraction of the distance travelled.
      function swirl(ax, ay, bx, by, k) {
        var dx = bx - ax, dy = by - ay, len = Math.hypot(dx, dy) || 1;
        return [(ax + bx) / 2 - dy / len * len * k, (ay + by) / 2 + dx / len * len * k];
      }

      var out = { x: 0, y: 0, r: 0, size: 0, a: 1, dot: 0 };
      function state(s, t) {
        var tStart = T.convStart + s.d1;
        var x, y, r, size, a = s.a0, dot = 0;
        var rStart = s.r0 + s.vr * tStart;
        var rEnd = Math.PI * 2 * Math.round(rStart / (Math.PI * 2));

        if (t < tStart) {
          var f = floatPos(s, t); x = f[0]; y = f[1];
          r = s.r0 + s.vr * t; size = s.s0;
          a = s.a0 * sm(t, 0, 0.8);
        } else {
          var u = clamp((t - tStart) / T.convDur, 0, 1), e = eio(u);
          var st = floatPos(s, tStart);
          var c = swirl(st[0], st[1], s.t1x, s.t1y, s.k1);
          var p = bez(st[0], st[1], c[0], c[1], s.t1x, s.t1y, e);
          x = p[0]; y = p[1]; r = lerp(rStart, rEnd, e); size = lerp(s.s0, s.ts1, e);
          a = lerp(s.a0, 1, e);
        }
        a *= 1 - 0.4 * sm(t, T.formA, T.formB);   // the mosaic stays visible under the crisp word

        if (t >= T.scatA) {
          var us = eout(clamp((t - T.scatA) / (T.scatB - T.scatA), 0, 1));
          x = lerp(s.t1x, s.sx, us); y = lerp(s.t1y, s.sy, us); r += 0.02;
        }
        if (t >= T.dissA) {
          dot = sm(t, T.dissA, T.dissB);
          size = lerp(s.ts1, 7, dot);
          a = lerp(a, 0.95, dot);
        }
        if (t >= T.reconA + s.d2) {
          var ur = clamp((t - T.reconA - s.d2) / T.reconDur, 0, 1), er = eio(ur);
          var c2 = swirl(s.sx, s.sy, s.t2x, s.t2y, -s.k2);
          var w = bez(s.sx, s.sy, c2[0], c2[1], s.t2x, s.t2y, er);
          x = w[0]; y = w[1];
          size = lerp(7, s.ts2 + 3, er);
        }
        if (t >= T.nameA) a = lerp(a, LIGHT ? 0 : 0.16, sm(t, T.nameA, T.nameB));
        out.x = x; out.y = y; out.r = r; out.size = size; out.a = a; out.dot = dot;
        return out;
      }

      function trailAlpha(t) {
        if (t < T.convStart) return 0.55;
        if (t < T.formA + 0.2) return 0.4;      // a short comet tail while letters fly in
        if (t < T.scatA) return 0.7;
        if (t < T.nameA) return 0.34;
        return 0.7;
      }

      function crisp(lay, alpha, pulse) {
        if (alpha <= 0.002) return;
        ctx.save();
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.globalAlpha = alpha;
        if (LIGHT) {
          ctx.shadowColor = 'rgba(8,18,48,0.20)';
          ctx.shadowBlur = 24 * dpr;
          ctx.shadowOffsetY = 9 * dpr;

          ctx.shadowColor = SIG;
          ctx.shadowBlur = (22 + 10 * pulse) * dpr;

        drawLines(ctx, lay, FG);
        ctx.shadowBlur = 0;
        ctx.shadowOffsetY = 0;
        ctx.shadowColor = 'transparent';
        drawLines(ctx, lay, FG);
        ctx.restore();

        // Role, tracked out. Accent colour on light, soft white on dark.
        ctx.globalAlpha = alpha * (LIGHT ? 0.95 : 0.85);

        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        if ('letterSpacing' in ctx) ctx.letterSpacing = '0.18em';
        ctx.fillStyle = LIGHT ? SIG : FG;
        ctx.fillText(ROLE.toUpperCase(), W / 2, subY + (1 - alpha) * 6);
        ctx.restore();

          ctx.setTransform(1, 0, 0, 1, 0, 0);

          ctx.drawImage(glow, x * dpr - sz / 2, y * dpr - sz / 2, sz, sz);

        ctx.globalCompositeOperation = 'source-over';
      }

      function draw(t) {

        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for (var i = 0; i < sprites.length; i++) {

          var gA = o.a * (1 - o.dot);
          if (gA > 0.01) {
            var cs = Math.cos(o.r), sn = Math.sin(o.r), k = o.size / 64 * dpr;
            ctx.setTransform(cs * k, sn * k, -sn * k, cs * k, o.x * dpr, o.y * dpr);

            ctx.drawImage((s.sig ? atlasSig : atlasFg)[s.ch], -32, -32);
          }

        ctx.globalCompositeOperation = GLOW_BLEND;
        for (var j = 0; j < sprites.length; j++) {
          var p = sprites[j], q = state(p, t);
          var dA = q.a * q.dot;
          if (dA > 0.01) {
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.globalAlpha = dA;
            var d = q.size * dpr;
            ctx.drawImage(glow, q.x * dpr - d / 2, q.y * dpr - d / 2, d, d);
          }
        }
        ctx.globalCompositeOperation = 'source-over';

        var holdPulse = 0.5 + 0.5 * Math.sin(t * 3);
        crisp(layout1, sm(t, T.formA, T.formB) * 0.95 * (1 - sm(t, T.dissA, T.dissA + 0.35)), holdPulse);
        crisp(layout2, sm(t, T.nameA, T.nameB), 0.3);
        subtitle(sm(t, T.subA, T.subB));
      }

      function drawStatic() {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.fillStyle = 'rgb(' + BG.join(',') + ')';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        crisp(layout2, 1, 0);
        subtitle(1);
      }

      var offset = reduced ? T.end : (seen ? T.nameA - 0.3 : 0);
      var t0 = performance.now();
      function now() { return (performance.now() - t0) / 1000 + offset; }

      function skip() { offset = Math.max(offset, T.nameA - 0.1 - (performance.now() - t0) / 1000); }
      skipBtn.addEventListener('click', skip);
      window.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !finished) skip(); });

      if (reduced || seen) skipBtn.style.display = 'none';

      function frame() {
        if (finished) return;
        var t = now();
        if (t >= T.end) { played = true; finish(); }
        if (reduced) drawStatic(); else draw(Math.min(t, T.end));
        requestAnimationFrame(frame);
      }

      var resizeTimer;
      window.addEventListener('resize', function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function () { if (!finished) build(); }, 150);
      });

      function start() {

        build();
        t0 = performance.now();
        requestAnimationFrame(frame);
      }

      var started = false;
      function go() { if (!started) { started = true; start(); } }
      if (document.fonts && document.fonts.load) {
        document.fonts.load('800 100px Bricolage').then(go, go);
        setTimeout(go, 1200);
      } else { go(); }
    })();
